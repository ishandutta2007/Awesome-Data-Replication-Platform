<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="streamGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="streamGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 46px; fill: url(#titleGrad); }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 20px; fill: #94a3b8; }
    .badge-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 14px; fill: #e2e8f0; }
    
    /* Dynamic Animations */
    @keyframes floatCard {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
      100% { transform: translateY(0px); }
    }

    .pulse-line1 {
      stroke-dasharray: 10 15;
      animation: dash 30s linear infinite;
    }

    @keyframes dash {
      to {
        stroke-dashoffset: -1000;
      }
    }

    .card-float-1 { animation: floatCard 4s ease-in-out infinite; }
    .card-float-2 { animation: floatCard 5s ease-in-out infinite 1s; }
    .card-float-3 { animation: floatCard 4.5s ease-in-out infinite 0.5s; }
  </style>

  <!-- Background -->
  <rect width="1200" height="400" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Pattern -->
  <g opacity="0.05">
    <path d="M0 50H1200 M0 100H1200 M0 150H1200 M0 200H1200 M0 250H1200 M0 300H1200 M0 350H1200" stroke="#ffffff" stroke-width="1"/>
    <path d="M100 0V400 M200 0V400 M300 0V400 M400 0V400 M500 0V400 M600 0V400 M700 0V400 M800 0V400 M900 0V400 M1000 0V400 M1100 0V400" stroke="#ffffff" stroke-width="1"/>
  </g>

  <!-- Dynamic Data Stream Background Lines (Behind Content) -->
  <g opacity="0.4">
    <path class="pulse-line1" d="M 100 320 Q 300 240 600 310 T 1100 250" fill="none" stroke="url(#streamGrad1)" stroke-width="4"/>
    <path class="pulse-line1" d="M 50 280 Q 400 360 750 260 T 1150 320" fill="none" stroke="url(#streamGrad2)" stroke-width="3"/>
  </g>

  <!-- Foreground Dynamic Elements (Decorative Floating Cards at Side) -->
  <g transform="translate(850, 60)" class="card-float-1" filter="url(#shadow)">
    <rect width="280" height="80" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <circle cx="35" cy="40" r="18" fill="#0284c7" opacity="0.2"/>
    <circle cx="35" cy="40" r="10" fill="#38bdf8"/>
    <text x="65" y="36" font-family="sans-serif" font-size="14" font-weight="bold" fill="#f1f5f9">Real-Time CDC</text>
    <text x="65" y="54" font-family="sans-serif" font-size="12" fill="#94a3b8">Log-Based Streaming</text>
    <path d="M 230 40 L 250 40 M 245 35 L 250 40 L 245 45" stroke="#38bdf8" stroke-width="2" fill="none"/>
  </g>

  <g transform="translate(850, 160)" class="card-float-2" filter="url(#shadow)">
    <rect width="280" height="80" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <circle cx="35" cy="40" r="18" fill="#7c3aed" opacity="0.2"/>
    <circle cx="35" cy="40" r="10" fill="#a855f7"/>
    <text x="65" y="36" font-family="sans-serif" font-size="14" font-weight="bold" fill="#f1f5f9">Heterogeneous Sync</text>
    <text x="65" y="54" font-family="sans-serif" font-size="12" fill="#94a3b8">Multi-Cloud &amp; On-Prem</text>
    <path d="M 230 40 L 250 40 M 245 35 L 250 40 L 245 45" stroke="#a855f7" stroke-width="2" fill="none"/>
  </g>

  <g transform="translate(850, 260)" class="card-float-3" filter="url(#shadow)">
    <rect width="280" height="80" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <circle cx="35" cy="40" r="18" fill="#059669" opacity="0.2"/>
    <circle cx="35" cy="40" r="10" fill="#34d399"/>
    <text x="65" y="36" font-family="sans-serif" font-size="14" font-weight="bold" fill="#f1f5f9">Zero Loss &amp; Low Latency</text>
    <text x="65" y="54" font-family="sans-serif" font-size="12" fill="#94a3b8">Sub-second Engine</text>
    <path d="M 230 40 L 250 40 M 245 35 L 250 40 L 245 45" stroke="#34d399" stroke-width="2" fill="none"/>
  </g>

  <!-- Foreground Title and Subtitle -->
  <g transform="translate(70, 130)" filter="url(#shadow)">
    <!-- Pill Badge -->
    <rect width="260" height="32" rx="16" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <circle cx="18" cy="16" r="6" fill="#10b981"/>
    <text x="32" y="21" class="badge-text">⚡ Top Data Ecosystem 2026</text>

    <!-- Main Title -->
    <text x="0" y="90" class="title" filter="url(#glow)">Awesome Data Replication</text>
    <text x="0" y="140" class="title">Platforms &amp; Tools</text>

    <!-- Subtitle -->
    <text x="0" y="185" class="subtitle">Curated SaaS Platforms, Enterprise Solutions &amp; Open-Source CDC Engines</text>
    <text x="0" y="212" class="subtitle" font-size="16" fill="#64748b">Change Data Capture • Streaming ETL • Database Sync • Multi-Master</text>
  </g>
</svg>
